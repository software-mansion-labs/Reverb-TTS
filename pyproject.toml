[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "placeholder-tts"
version = "1.0.0"
description = "Voice-cloning text-to-speech in seven languages"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Software Mansion"}]
keywords = ["tts", "text-to-speech", "speech-synthesis", "voice-cloning", "zero-shot", "multilingual"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",          # resampling the reference recording
    "transformers>=5.3,<6",     # the Qwen3 backbone and the Higgs audio codec
    "safetensors>=0.4",
    "huggingface-hub>=1.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    "verbalis>=0.1.1,<0.2",     # text preparation: numbers, dates, symbols and abbreviations read out as words
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["placeholder_tts"]

[tool.hatch.build.targets.sdist]
include = ["placeholder_tts", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
